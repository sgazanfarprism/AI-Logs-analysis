apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: log-analyzer-results-pvc
  namespace: log-analyzer
  labels:
    app: log-analyzer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
