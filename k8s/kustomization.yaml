apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: log-analyzer

resources:
  - namespace.yaml
  - secrets.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  # Uncomment to use CronJob instead of Deployment scheduler
  # - cronjob.yaml

commonLabels:
  app: log-analyzer
  managed-by: kustomize

images:
  - name: ai-log-analysis
    newTag: latest
