apiVersion: v1
kind: ConfigMap
metadata:
  name: log-analyzer-config
  namespace: log-analyzer
data:
  # Gemini AI
  GEMINI_MODEL: "gemini-2.5-flash"

  # SMTP Email
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  ALERT_RECIPIENTS: "it.support@prismxai.com,gazanfar.syed@prismxai.com"

  # AWS CloudWatch
  AWS_REGION: "us-east-1"
  CLOUDWATCH_LOG_GROUP: "/ecs/myapp"
  ECS_CLUSTER: "CA-PROD-CLR"

  # Logging
  LOG_LEVEL: "INFO"

  # Analysis
  DEFAULT_ANALYSIS_HOURS: "1"
  MAX_LOGS_PER_RUN: "50000"
